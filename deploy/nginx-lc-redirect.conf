# LifeCore /lc legacy redirect — applied to the blog server block alongside
# the existing /console location. Old iframe-embedded console.html is gone;
# users hitting /lc are bounced into the new SPA at /console/lc-today.
#
# Usage:
#   1. In /etc/nginx/sites-enabled/windgraham.art (or equivalent) find the
#      existing `location = /lc { ... }` block and REPLACE it with the line
#      below (or merge with surrounding config).
#   2. nginx -t && systemctl reload nginx
#
# Note: lifecore-server (port 8790) is no longer in the request path for
# the dashboard UI; only its /v1/* and /v2/* APIs remain proxied through
# the existing /console/ block (or a dedicated /api/ block if added later).

location = /lc { return 301 /console/lc-today; }
location = /lc/ { return 301 /console/lc-today; }

# Optional: legacy query/path forms (e.g. /lc?embed=1) → also redirect.
location ~ ^/lc($|\?) { return 301 /console/lc-today$is_args$args; }
location ~ ^/lc/($|\?) { return 301 /console/lc-today$is_args$args; }
